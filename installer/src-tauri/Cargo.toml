[package]
name = "magnum-installer"
version = "0.1.1"
description = "MagNum installer"
authors = ["Nethers Games"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
winreg = "0.52"
dirs = "5.0"
rfd = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
